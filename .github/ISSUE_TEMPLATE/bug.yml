name: Bug report
description: A command that fails, crashes or does something other than the usage guide says
body:
  - type: markdown
    attributes:
      value: Leave your token out of everything below. Security problems go to a private report, as SECURITY.md says.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `nai --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command as you ran it; with `--dry-run` if the problem shows there
      render: sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The JSON nai printed
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a difference from the official web client, what it does with the same settings
    validations:
      required: true
